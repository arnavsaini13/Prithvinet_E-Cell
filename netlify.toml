[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.11"

# API routes → Python serverless function (must come before SPA catch-all)
[[redirects]]
  from   = "/auth"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

[[redirects]]
  from   = "/auth/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

